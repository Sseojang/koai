<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알고리즘 기말고사 정답지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e8;--surf:#fffaf0;--surf2:#f0ebe0;--bord:#d8cfbd;--text:#20201d;--muted:#6e6a60;--accent:#1d6b5f;--acc2:#2a8a7a;--r:12px;--rs:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(90deg,rgba(32,32,29,.04) 1px,transparent 1px),linear-gradient(rgba(32,32,29,.035) 1px,transparent 1px),var(--bg);background-size:28px 28px;color:var(--text);line-height:1.78;font-size:15px}
#app{max-width:1040px;margin:0 auto;padding:2rem 1.25rem 5rem}
.hdr{border-bottom:1px solid var(--bord);padding:2.2rem 0 1.4rem;margin-bottom:1.35rem}
.badge{display:inline-flex;color:var(--acc2);background:rgba(29,107,95,.12);border:1px solid rgba(29,107,95,.3);padding:.28rem .78rem;border-radius:99px;font-size:.72rem;font-weight:800;letter-spacing:.05em;margin-bottom:.7rem}
h1{font-family:'JetBrains Mono',monospace;font-size:1.55rem;font-weight:700;margin-bottom:.35rem}
.hdr p{color:var(--muted);font-size:.9rem}
.home{display:inline-flex;margin-top:.8rem;color:var(--accent);font-weight:800;text-decoration:none}
.round-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}
.round-btn{border:1px solid var(--bord);background:var(--surf);border-radius:var(--r);padding:1rem;text-align:left;color:var(--text);font-family:inherit;font-weight:800;cursor:pointer}
.round-btn span{display:block;font-size:.74rem;color:var(--muted);font-weight:700;margin-top:.15rem}
.round-btn.active{background:var(--accent);border-color:var(--accent);color:#fffaf0}
.round-btn.active span{color:#fffaf0;opacity:.82}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.filter{border:1px solid var(--bord);background:var(--surf);border-radius:99px;padding:.45rem .75rem;color:var(--muted);font-family:inherit;font-size:.78rem;font-weight:800;cursor:pointer}
.filter.active{background:var(--accent);border-color:var(--accent);color:#fffaf0}
.card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:1.35rem;margin-bottom:1rem}
.round-title{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.round-title h2{font-size:1.15rem}
.round-title p{font-family:'JetBrains Mono',monospace;font-size:.82rem;color:var(--muted)}
.answer-item{background:var(--surf2);border:1px solid var(--bord);border-radius:var(--rs);padding:1rem;margin-bottom:.8rem}
.q-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.7rem}
.q-num{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:800;background:var(--accent);color:#fffaf0;border-radius:var(--rs);padding:.2rem .55rem}
.q-cat{font-size:.74rem;font-weight:800;color:var(--acc2);border:1px solid rgba(29,107,95,.25);background:rgba(29,107,95,.1);border-radius:99px;padding:.12rem .5rem}
.q-score{font-size:.72rem;color:var(--muted);font-weight:800}
.q-title{font-weight:800;margin-bottom:.45rem}
.section-label{font-size:.72rem;font-weight:900;color:var(--acc2);letter-spacing:.06em;margin:.7rem 0 .2rem;text-transform:uppercase}
.md{font-size:.92rem;line-height:1.8}
.md h3{font-size:.98rem;color:var(--acc2);margin:.8rem 0 .35rem}
.md p{margin:.45rem 0}
.md ul,.md ol{padding-left:1.2rem;margin:.45rem 0}
.md li{margin:.2rem 0}
.md code{font-family:'JetBrains Mono',monospace;background:rgba(32,32,29,.08);border-radius:4px;padding:.08rem .3rem;color:var(--acc2)}
.md pre{background:#f8f2e8;border:1px solid var(--bord);border-left:4px solid rgba(29,107,95,.35);border-radius:var(--rs);padding:.75rem .9rem;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:.8rem;line-height:1.6;margin:.55rem 0;color:#2f3a36}
.md table{border-collapse:collapse;margin:.65rem 0;font-size:.84rem;min-width:460px}
.md th,.md td{border:1px solid var(--bord);padding:.35rem .65rem;text-align:center}
.md th{background:#e9e2d4;color:var(--acc2)}
.md td{font-family:'JetBrains Mono',monospace;font-size:.8rem}
.table-scroll{overflow-x:auto}
.answer-box{border-top:1px dashed var(--bord);margin-top:.85rem;padding-top:.75rem;background:rgba(29,107,95,.035);border-radius:var(--rs)}
.loading,.error{background:var(--surf);border:1px dashed var(--bord);border-radius:var(--r);padding:1.2rem;color:var(--muted)}
.error{border-color:#a33d2d;color:#a33d2d}
@media(max-width:720px){#app{padding:1rem .85rem 4rem}.round-nav{grid-template-columns:1fr}.round-title{display:block}}
</style>
</head>
<body>
<div id="app">
  <header class="hdr">
    <div class="badge">PRIVATE ANSWER KEY</div>
    <h1>알고리즘 기말고사 정답지</h1>
    <p>학생 풀이 화면과 분리된 관리용 정답 페이지입니다. 현재 1~6회차 데이터를 자동으로 불러옵니다.</p>
    <a class="home" href="../algorithm-final.html">학생 풀이 페이지로 이동</a>
  </header>
  <nav class="round-nav" id="round-nav"></nav>
  <div class="tools" id="filters"></div>
  <main id="content" class="loading">정답 데이터를 불러오는 중입니다.</main>
</div>

<script>
let ROUNDS = [];
let activeRound = 0;
let activeFilter = '전체';
let parseProblems;
let renderMarkdown;

function escapeHtml(value){
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadData(){
  const html = await fetch('../algorithm-final.html').then(function(res){
    if(!res.ok) throw new Error('algorithm-final.html을 불러오지 못했습니다.');
    return res.text();
  });
  const extra = await fetch('../algorithm-final-extra-rounds.js').then(function(res){
    if(!res.ok) throw new Error('algorithm-final-extra-rounds.js를 불러오지 못했습니다.');
    return res.text();
  });
  const inline = (html.match(/<script>([\s\S]*?)<\/script>/)||[])[1];
  if(!inline) throw new Error('학생 페이지에서 문제 스크립트를 찾지 못했습니다.');

  const fakeElement = function(){
    return {
      style:{},
      classList:{toggle(){},add(){},remove(){}},
      textContent:'',
      innerHTML:'',
      value:'',
      disabled:false,
      addEventListener(){},
      remove(){},
      closest(){return {remove(){}}}
    };
  };
  const fakeDocument = {getElementById:fakeElement,createElement:fakeElement,body:{appendChild(){}}};
  const fakeWindow = {addEventListener(){},scrollTo(){},ALGORITHM_FINAL_ROUNDS:[]};
  const fakeStorage = {getItem(){return null},setItem(){}};
  const runner = new Function(
    'window','document','localStorage','history','location',
    inline + '\n' + extra + '\nreturn {rounds: window.ALGORITHM_FINAL_ROUNDS, parseProblems, renderMarkdown};'
  );
  return runner(fakeWindow,fakeDocument,fakeStorage,{replaceState(){}},{hash:'',pathname:'../algorithm-final.html'});
}

function categories(problems){
  return ['전체'].concat(Array.from(new Set(problems.map(function(p){return p.category}))));
}

function renderNav(){
  document.getElementById('round-nav').innerHTML = ROUNDS.map(function(round,index){
    const count = parseProblems(round.md).length;
    return '<button class="round-btn '+(index===activeRound?'active':'')+'" onclick="selectRound('+index+')">'+escapeHtml(round.label)+'<span>'+count+'문항 · 상세 풀이</span></button>';
  }).join('');
}

function renderFilters(problems){
  document.getElementById('filters').innerHTML = categories(problems).map(function(cat){
    return '<button class="filter '+(cat===activeFilter?'active':'')+'" onclick="selectFilter(\''+cat.replace(/'/g,'\\\'')+'\')">'+escapeHtml(cat)+'</button>';
  }).join('');
}

function renderRound(){
  const round = ROUNDS[activeRound];
  const problems = parseProblems(round.md);
  const filtered = activeFilter === '전체' ? problems : problems.filter(function(p){return p.category === activeFilter});
  renderNav();
  renderFilters(problems);
  document.getElementById('content').className = '';
  document.getElementById('content').innerHTML =
    '<section class="card"><div class="round-title"><div><h2>'+escapeHtml(round.title)+'</h2><p>'+filtered.length+' / '+problems.length+'문항 표시</p></div></div>'+
    filtered.map(function(p){
      return '<article class="answer-item">'+
        '<div class="q-head"><span class="q-num">Q'+p.num+'</span><span class="q-cat">'+escapeHtml(p.category)+'</span><span class="q-score">'+p.score+'점</span></div>'+
        '<div class="q-title">'+escapeHtml(p.title)+'</div>'+
        '<div class="section-label">문제</div><div class="md">'+renderMarkdown(p.question)+'</div>'+
        '<div class="answer-box"><div class="section-label">정답 및 상세 풀이</div><div class="md">'+renderMarkdown(p.answer || '등록된 정답이 없습니다.')+'</div></div>'+
      '</article>';
    }).join('')+
    '</section>';
}

function selectRound(index){
  activeRound = index;
  activeFilter = '전체';
  renderRound();
  window.scrollTo({top:0,behavior:'smooth'});
}

function selectFilter(cat){
  activeFilter = cat;
  renderRound();
}

loadData().then(function(data){
  ROUNDS = data.rounds;
  parseProblems = data.parseProblems;
  renderMarkdown = data.renderMarkdown;
  renderRound();
}).catch(function(error){
  document.getElementById('content').className = 'error';
  document.getElementById('content').innerHTML = '정답 데이터를 불러오지 못했습니다.<br>정적 서버에서 <code>/seojang/</code> 경로로 열어 주세요.<br><br>'+escapeHtml(error.message);
});
</script>
</body>
</html>
